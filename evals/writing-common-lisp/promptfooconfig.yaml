# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: writing-common-lisp observable behavior v2 (native Codex SDK)

prompts:
  - id: with-skill
    label: with-skill-task
    raw: '{{task}}'

providers:
  - id: openai:codex-sdk
    label: with-skill
    prompts: [with-skill]
    config:
      model: gpt-6-sol
      model_reasoning_effort: medium
      working_dir: '{{workspaceWithSkill}}'
      copy_working_dir: copy
      sandbox_mode: workspace-write
      approval_policy: never
      web_search_mode: disabled
      network_access_enabled: false
      enable_streaming: true
      persist_threads: false

defaultTest:
  assert:
    - type: javascript
      value: file://../lib/workspace-grade.cjs
      metric: Contract

evaluateOptions:
  maxConcurrency: 1

tests: file://cases.json
